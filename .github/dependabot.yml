version: 2
updates:
  # .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/src/auth-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    
  - package-ecosystem: "nuget" 
    directory: "/src/body-analysis-ai/BodyAnalysisBackend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    
  # Python dependencies  
  - package-ecosystem: "pip"
    directory: "/src/body-analysis-ai/BodyAnalysisAI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/src/auth-api"
    schedule:
      interval: "weekly"
      
  - package-ecosystem: "docker"
    directory: "/src/body-analysis-ai/BodyAnalysisAI"  
    schedule:
      interval: "weekly"
      
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
